<?xml version="1.0" encoding="UTF-8"?>
<!--
  OLEDGuard app icon.

  The subject is the thing the app does: one display, split down the middle.
  The left half is #000000 - OLED pixels genuinely off, which is the point of
  the tool - and the right half is lit content spilling a little glow onto the
  bezel. The light bezel frames the dark half so it reads as "off" rather than
  as a hole punched in the icon, at every size down to 32px.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#453E75"/>
      <stop offset="0.55" stop-color="#241F44"/>
      <stop offset="1"    stop-color="#141122"/>
    </linearGradient>

    <linearGradient id="lit" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#2DD4E8"/>
      <stop offset="0.5"  stop-color="#5B6BF0"/>
      <stop offset="1"    stop-color="#E36FF2"/>
    </linearGradient>

    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FC"/>
      <stop offset="1" stop-color="#A7AEC6"/>
    </linearGradient>

    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9CFE2"/>
      <stop offset="1" stop-color="#8E96B2"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>

    <filter id="drop" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20"
                    flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <!-- Everything painted on the panel is clipped to the panel. -->
    <clipPath id="panel">
      <rect x="238" y="310" width="548" height="332" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <!-- rounded-square app shape, 824x824 centred on the 1024 canvas -->
  <g id="bglayer">
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- light thrown by the lit half onto the surroundings -->
  <ellipse cx="660" cy="470" rx="350" ry="320" fill="url(#glow)"/>
  </g>

  <g id="fglayer">


  <!-- stand -->
  <rect x="477" y="658" width="70" height="52" fill="url(#stand)"/>
  <rect x="392" y="702" width="240" height="28" rx="14" ry="14" fill="url(#stand)"/>

  <!-- bezel -->
  <rect x="222" y="294" width="580" height="364" rx="34" ry="34" fill="url(#bezel)"/>

  <!-- panel -->
  <g clip-path="url(#panel)">
    <!-- left half: pixels off -->
    <rect x="238" y="310" width="274" height="332" fill="#000000"/>
    <!-- right half: lit content -->
    <rect x="512" y="310" width="274" height="332" fill="url(#lit)"/>
    <!-- abstract content on the lit half -->
    <circle cx="730" cy="590" r="145" fill="#FFFFFF" opacity="0.12"/>
    <rect x="546" y="356" width="190" height="22" rx="11" fill="#FFFFFF" opacity="0.38"/>
    <rect x="546" y="396" width="118" height="22" rx="11" fill="#FFFFFF" opacity="0.24"/>
    <rect x="546" y="436" width="158" height="22" rx="11" fill="#FFFFFF" opacity="0.16"/>
    <!-- a faint edge so the dark half still reads as glass, not a hole -->
    <rect x="239" y="311" width="272" height="330" rx="19" ry="19"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>
    <!-- the seam: the whole idea of the app in one line -->
    <rect x="509" y="310" width="6" height="332" fill="#FFFFFF" opacity="0.30"/>
  </g>
  </g>
</svg>
