<?xml version="1.0" encoding="UTF-8"?>
<!--
  Background plate for Icon Composer: full-bleed and unrounded.

  Icon Composer applies its own shape mask, glass and per-appearance
  treatment, so this must carry no rounded corners of its own and must NOT be
  pre-darkened. Supplying an already-dark plate here is how you end up with a
  dark appearance that has been darkened twice.

  The glow lives here rather than in the foreground: it is atmosphere, not an
  object, and glass treatment applied to a soft gradient reads as a smudge.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#453E75"/>
      <stop offset="0.55" stop-color="#241F44"/>
      <stop offset="1"    stop-color="#141122"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="660" cy="470" rx="350" ry="320" fill="url(#glow)"/>
</svg>
