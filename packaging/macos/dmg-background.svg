<?xml version="1.0" encoding="UTF-8"?>
<!--
  Backdrop for the OLEDGuard disk image, 640x400, matching the 640x400 window
  make_dmg.sh opens. Rasterise with make_dmg_bg.py, which writes both scales
  into dmg/.

  The two faint plates mark where Finder places the icons, tall enough to hold
  the label Finder draws under each one: the app at
  (160, 185) and the Applications alias at (480, 185), both icon centres. Move
  a plate here and the matching position in make_dmg.sh, or they drift apart.

  Colours are the icon's own: the same diagonal wash, and the same cyan to
  violet ramp for the lit strip along the bottom edge, which is the icon's
  half-off, half-lit idea reduced to three pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#453E75"/>
      <stop offset="0.55" stop-color="#241F44"/>
      <stop offset="1"    stop-color="#141122"/>
    </linearGradient>

    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2DD4E8"/>
      <stop offset="0.5"  stop-color="#5B6BF0"/>
      <stop offset="1"    stop-color="#E36FF2"/>
    </linearGradient>

    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#4CC9F0" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#5B6BF0" stop-opacity="0.13"/>
      <stop offset="1"   stop-color="#5B6BF0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>

    <linearGradient id="chev" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E36FF2" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- light thrown by the lit half of a screen, centred on the app icon -->
  <ellipse cx="160" cy="190" rx="245" ry="190" fill="url(#bloom)"/>
  <rect width="640" height="400" fill="url(#vignette)"/>

  <!-- wordmark -->
  <text x="320" y="62" text-anchor="middle"
        font-family="Liberation Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="bold" fill="#F2F4FB"
        letter-spacing="0.4">OLEDGuard</text>
  <text x="320" y="92" text-anchor="middle"
        font-family="Liberation Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14" fill="#A9B0CC">Drag the app onto Applications</text>

  <!-- icon plates -->
  <g fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07">
    <rect x="86"  y="111" width="148" height="168" rx="30"/>
    <rect x="406" y="111" width="148" height="168" rx="30"/>
  </g>

  <!-- direction of travel -->
  <g fill="none" stroke="url(#chev)" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M284 173 l14 12 -14 12"/>
    <path d="M306 173 l14 12 -14 12"/>
    <path d="M328 173 l14 12 -14 12"/>
  </g>

  <!-- what to do when Gatekeeper refuses the first launch -->
  <text x="320" y="332" text-anchor="middle"
        font-family="Liberation Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11.5" fill="#7F87A9">Unsigned build. If macOS refuses to open it, allow it once in</text>
  <text x="320" y="350" text-anchor="middle"
        font-family="Liberation Sans, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11.5" fill="#7F87A9">System Settings &#8250; Privacy &amp; Security &#8250; Open Anyway.</text>

  <!-- half off, half lit: the icon's idea, three pixels tall -->
  <rect x="0"   y="397" width="320" height="3" fill="#000000"/>
  <rect x="320" y="397" width="320" height="3" fill="url(#lit)"/>
</svg>
