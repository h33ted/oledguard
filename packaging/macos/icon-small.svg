<?xml version="1.0" encoding="UTF-8"?>
<!--
  OLEDGuard app icon, small-size variant (16, 32 and 64 px).

  At 16px the whole 824px app shape lands on roughly thirteen pixels, so the
  stand, the content bars and the glow of the detailed icon all collapse into
  mush. This variant keeps only what survives: a big split panel, a bezel thick
  enough to still register as a light edge after antialiasing, and the seam.
  Same colours and same idea, fewer shapes - which is how Apple's own icons
  handle the bottom of the size range.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#453E75"/>
      <stop offset="0.55" stop-color="#241F44"/>
      <stop offset="1"    stop-color="#141122"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0"   stop-color="#2DD4E8"/>
      <stop offset="0.5" stop-color="#5B6BF0"/>
      <stop offset="1"   stop-color="#E36FF2"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FC"/>
      <stop offset="1" stop-color="#B4BACE"/>
    </linearGradient>
    <clipPath id="panel">
      <rect x="228" y="316" width="568" height="392" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>

  <!-- one chunky monitor, no stand: below 64px a stand is a smear -->
  <rect x="192" y="280" width="640" height="464" rx="46" ry="46" fill="url(#bezel)"/>

  <g clip-path="url(#panel)">
    <rect x="228" y="316" width="284" height="392" fill="#000000"/>
    <rect x="512" y="316" width="284" height="392" fill="url(#lit)"/>
    <rect x="506" y="316" width="12" height="392" fill="#FFFFFF" opacity="0.32"/>
  </g>
</svg>
